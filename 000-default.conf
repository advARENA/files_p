    RewriteRule ^(.*)$ %{REQUEST_URI}/ [L]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /ollama-queue/index.html [L]
</Directory>

# API → uvicorn (префикс /ollama-queue/api снимается, на бэкенд уходит /monitor/..., /health, /docs и т.д.)
ProxyPass        /ollama-queue/api/ http://127.0.0.1:8026/
ProxyPassReverse /ollama-queue/api/ http://127.0.0.1:8026/
    
