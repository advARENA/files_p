<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

    Alias "/alg" "/var/www/tv_alg_project/front/build"
<Directory "/var/www/tv_alg_project/front/build">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    
    # Включаем обработку URL rewrite
    RewriteEngine On
    RewriteBase /alg/
    
    # Перенаправляем /alg на /alg/ с добавлением слеша
    RewriteCond %{REQUEST_URI} ^/alg$
    RewriteRule ^(.*)$ $1/ [R=301,L]
    
    # Для SPA: перенаправляем все запросы на index.html
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /alg/index.html [L]
</Directory>

    Alias "/rostics-map" "/var/www/rostics_map/map/build"
<Directory "/var/www/rostics_map/map/build">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    RewriteEngine On
    RewriteBase /rostics-map/

    # Добавляем слеш если его нет
    RewriteCond %{REQUEST_URI} ^/rostics-map$
    RewriteRule ^(.*)$ $1/ [R=301,L]

    # Если запрос не к API и не к существующему файлу
    RewriteCond %{REQUEST_URI} !^/rostics-map/api/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    # Перенаправляем на index.html
    RewriteRule ^(.*)$ /rostics-map/index.html [L]
</Directory>

