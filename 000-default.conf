# ws-scrcpy по /android-web
ProxyPass /android-web http://127.0.0.1:8017/android-web
ProxyPassReverse /android-web http://127.0.0.1:8017/android-web

# WebSocket для /android-web
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/android-web [NC]
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/android-web(.*)$ ws://127.0.0.1:8017/android-web$1 [P,L]

    Alias "/skb" "/var/www/digital-spy-web_skb/creative_project/build"
